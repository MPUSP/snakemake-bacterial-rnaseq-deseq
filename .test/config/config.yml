samplesheet: "config/samplesheet/samplesheet.tsv"
libtype: "sense"

get_genome:
  database: "ncbi"
  assembly: "GCF_043231225.1"
  fasta: null
  gff: null
  gff_source_type:
    [
      "RefSeq": "gene",
      "RefSeq": "pseudogene",
      "RefSeq": "CDS",
      "Protein Homology": "CDS",
    ]

extract_features:
  biotypes: ["protein_coding", "pseudogene", "ncRNA", "rRNA", "tRNA"]

umi_dedup: "--edit-distance-threshold=0"
umi_extraction:
  method: string
  pattern: "--bc-pattern X --bc-pattern2 NNNNNN --3prime --ignore-read-pair-suffixes"

cutadapt:
  read1_adapter: "TTCAAAGCATCAGCCC"
  read2_adapter: "GGGCTGATGCTTTGAA"
  default: ["-q 10 ", "-m 18 ", "--overlap=10"]

star:
  index: null
  genomeSAindexNbases: 9
  multi: 10
  sam_multi: 1
  intron_max: 1
  default:
    [
      "--readFilesCommand zcat ",
      "--outSAMstrandField None ",
      "--outSAMattributes All ",
      "--outSAMattrIHstart 0 ",
      "--outFilterType Normal ",
      "--outFilterMultimapScoreRange 1 ",
      "-o STARmappings ",
      "--outSAMtype BAM Unsorted ",
      "--outStd BAM_Unsorted ",
      "--outMultimapperOrder Random ",
      "--alignEndsType EndToEnd",
    ]

feature_counts:
  defaults:
    [
      "-F GTF",
      "-t gene",
      "-g locus_tag",
      "-M",
      "--fracOverlap 0.2",
      "--largestOverlap",
    ]

deeptools:
  bin_size: 1
  normalize: "CPM"
  defaults: "--exactScaling"
  paired_end: "--extendReads"

multiqc:
  config: "config/multiqc_config.yml"
  defaults:
    ["--dirs-depth 2 ", "--exclude general_stats ", "--force ", "--dirs"]

deseq2:
  threshold_pval: 0.05
  threshold_log2fc: 2.0
